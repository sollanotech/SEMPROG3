name: SEMPROG3

on:
  push:                    
    branches: ["main"]
  pull_request:            
    branches: ["main"]
  workflow_dispatch:       

jobs:
  executar-testes:        
    name: Testar em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}  # ✅ Usa o sistema da lista

    strategy:
      fail-fast: false          # ✅ Não para tudo se um falhar
      matrix:
        os:                     # 🖥️ Lista de SOs
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: 📥 Pegar código
        uses: actions/checkout@v4

      - name: 🐍 Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependências
        run: pip install pytest

      - name: 🧪 Executar testes
        run: python -m pytest -v